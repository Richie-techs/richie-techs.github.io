
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShipTrack - Customer Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f7;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-box {
    background: white;
    width: 100%;
    max-width: 420px;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 5px 25px #0001;
}

.logo {
    text-align: center;
    color: #2563eb;
    font-size: 35px;
    font-weight: bold;
}

h2 {
    color: #1e293b;
    margin-top: 30px;
}

p {
    color: #64748b;
    line-height: 1.5;
}

label {
    display: block;
    margin-top: 20px;
    font-weight: bold;
    color: #1e293b;
}

input {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    font-size: 15px;
}

.show-password {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
}

.show-password input {
    width: auto;
    margin: 0;
}

.show-password label {
    margin: 0;
    font-weight: normal;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 25px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
}

#message {
    overflow-wrap: anywhere;
    font-size: 14px;
}

.footer {
    text-align: center;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">↗ ShipTrack</div>

    <h2>Welcome Back!</h2>

    <p>
        Sign in to access your shipment tracking dashboard.
    </p>

    <form id="loginForm">

        <label for="email">Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <div class="show-password">
            <input type="checkbox" id="showPassword">
            <label for="showPassword">Show password</label>
        </div>

        <button type="submit" id="loginButton">
            Sign In
        </button>

        <p id="message" role="alert"></p>

    </form>

    <div class="footer">
        <p>Secure shipment tracking with ShipTrack.</p>
    </div>

</div>

<script>

// SUPABASE CONFIGURATION
const SUPABASE_URL = "https://vaebulmgychqvogzqesi.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_U8ILGJoA9hWP8HZnQ8qF3g_3ecS_IeN";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// CHECK EXISTING SESSION
async function checkSession() {

    const { data, error } =
        await supabaseClient.auth.getSession();

    if (!error && data.session) {
        window.location.replace("tracking.html");
    }
}

checkSession();

// SHOW OR HIDE PASSWORD
document.getElementById("showPassword")
.addEventListener("change", function() {

    document.getElementById("password").type =
        this.checked ? "text" : "password";

});

// LOGIN
document.getElementById("loginForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("loginButton");

    button.disabled = true;
    button.textContent = "Signing in...";
    message.textContent = "";

    try {

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) {
            message.textContent = error.message;
            button.disabled = false;
            button.textContent = "Sign In";
            return;
        }

        window.location.href = "tracking.html";

    } catch (error) {

        message.textContent =
            "Connection error. Please try again.";

        button.disabled = false;
        button.textContent = "Sign In";
    }

});

</script>

</body>
</html>
