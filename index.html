
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwiftShip - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f7;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-box {
    background: white;
    width: 100%;
    max-width: 400px;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 5px 25px #0001;
}

h1 {
    color: #2563eb;
    text-align: center;
}

h2 {
    color: #1e293b;
}

p {
    color: #64748b;
}

label {
    display: block;
    margin-top: 18px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.password-option {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
}

.password-option input {
    width: auto;
    margin: 0;
}

#message {
    margin-top: 15px;
    font-size: 14px;
}

</style>
</head>

<body>

<div class="login-box">

<h1>SwiftShip</h1>

<h2>Welcome Back!</h2>
<p>Sign in to access your shipment dashboard.</p>

<form id="loginForm">

<label>Email Address</label>
<input type="email" id="email"
placeholder="Enter your email" required>

<label>Password</label>
<input type="password" id="password"
placeholder="Enter your password" required>

<div class="password-option">
<input type="checkbox" id="showPassword">
<label for="showPassword" style="margin:0">
Show password
</label>
</div>

<button type="submit" id="loginButton">
Sign In
</button>

</form>

<p id="message"></p>

</div>

<script>

// Supabase credentials
const SUPABASE_URL = "https://vaebulmgychqvogzqesi.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_U8ILGJoA9hWP8HZnQ8qF3g_3ecS_IeN";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// Redirect existing logged-in users
async function checkSession() {
    const { data } =
        await supabaseClient.auth.getSession();

    if (data.session) {
        window.location.replace("Login.html");
    }
}

checkSession();

// Show or hide password
document.getElementById("showPassword")
.addEventListener("change", function() {

    document.getElementById("password").type =
        this.checked ? "text" : "password";

});

// Login
document.getElementById("loginForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("loginButton");

    button.disabled = true;
    button.textContent = "Signing in...";
    message.textContent = "";

    const { error } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

    if (error) {
        message.textContent = error.message;
        button.disabled = false;
        button.textContent = "Sign In";
        return;
    }

    window.location.href = "Login.html";

});

</script>

</body>
</html>
