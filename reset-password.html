<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShipTrack — Reset password</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand auth-brand" href="index.html"><span class="logo">↗</span> ShipTrack</a>
    <p class="eyebrow">ACCOUNT SECURITY</p>
    <h1>Choose a new password</h1>
    <p class="muted">Enter and confirm your new password.</p>
    <form id="resetForm">
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required>
      <label for="confirmNewPassword">Confirm new password</label>
      <input id="confirmNewPassword" type="password" minlength="8" autocomplete="new-password" required>
      <button class="btn primary full" id="resetButton" type="submit">Update password</button>
      <p class="form-message" id="resetMessage" role="status" aria-live="polite"></p>
    </form>
    <p class="auth-switch"><a href="index.html">Return to sign in</a></p>
  </main>
<script>
const url = window.SHIPTRACK_SUPABASE_URL;
const key = window.SHIPTRACK_SUPABASE_PUBLISHABLE_KEY;
const message = document.getElementById("resetMessage");
const button = document.getElementById("resetButton");

if (!window.supabase || !url || !key ||
    url.includes("PASTE_YOUR") || key.includes("PASTE_YOUR")) {
  message.textContent = "Supabase is not configured. Update config.js.";
  button.disabled = true;
} else {
  const client = window.supabase.createClient(url, key);
  document.getElementById("resetForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const password = document.getElementById("newPassword").value;
    const confirmation = document.getElementById("confirmNewPassword").value;
    if (password.length < 8) {
      message.textContent = "Use at least 8 characters.";
      return;
    }
    if (password !== confirmation) {
      message.textContent = "The passwords do not match.";
      return;
    }
    button.disabled = true;
    button.textContent = "Updating…";
    const { error } = await client.auth.updateUser({ password });
    if (error) {
      message.textContent = error.message;
      button.disabled = false;
      button.textContent = "Update password";
      return;
    }
    message.textContent = "Password updated. You can now sign in.";
    message.className = "form-message success";
    button.textContent = "Updated";
    setTimeout(() => location.replace("index.html"), 1500);
  });
}
</script>
</body>
</html>
